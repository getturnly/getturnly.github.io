<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All set — Turnly</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#060407;color:#F7F2F5;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
  .glow{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);width:640px;height:640px;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,45,141,.22),rgba(255,45,141,.05) 55%,transparent 72%)}
  .wrap{position:relative;max-width:420px}
  .mark{width:86px;height:86px;border-radius:24px;margin:0 auto 22px;background:linear-gradient(180deg,#FF4396,#F01F7A);
    display:flex;align-items:center;justify-content:center;box-shadow:0 16px 44px rgba(255,45,141,.42)}
  .check{width:76px;height:76px;border-radius:50%;margin:0 auto 20px;background:rgba(57,255,136,.13);
    border:2px solid rgba(57,255,136,.45);display:flex;align-items:center;justify-content:center;font-size:34px;color:#5CFF9E}
  h1{font-size:29px;letter-spacing:-.3px;margin-bottom:10px}
  p{font-size:15.5px;line-height:1.6;color:#9C8F97}
  .steps{margin-top:24px;background:#100B12;border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:20px;text-align:left}
  .steps div{font-size:14px;line-height:1.55;color:#D9D0D6;margin-bottom:9px}
  .steps div:last-child{margin-bottom:0}
  .steps b{color:#FF6AAE}
  .foot{margin-top:22px;font-size:12.5px;color:#5C525A}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="mark">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
      <path d="M4.6 11 12 4.4 19.4 11" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.4 10.2V20.2H17.6V10.2" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#fff">
        <path d="M11.6 14.1H9.5V13.4Q9.5 11.1 11.6 11.1Z"/><path d="M12.4 14.1H14.5V13.4Q14.5 11.1 12.4 11.1Z"/>
        <path d="M9.5 14.8H11.6V17.9H10Q9.5 17.9 9.5 17.4Z"/><path d="M14.5 14.8H12.4V17.9H14Q14.5 17.9 14.5 17.4Z"/>
      </g>
    </svg>
  </div>
  <div class="check">&#10003;</div>
  <h1>All set!</h1>
  <p>Your bank details went through. You can close this window and head back to Turnly.</p>
  <div class="steps">
    <div>1. Close this window (tap <b>Done</b> or <b>&times;</b> up top)</div>
    <div>2. In Turnly, go to <b>Profile</b></div>
    <div>3. Tap <b>“I finished on Stripe — check status”</b></div>
  </div>
  <div class="foot">Payouts are handled securely by Stripe. Turnly never sees your bank details.</div>
</div>
</body>
</html>
